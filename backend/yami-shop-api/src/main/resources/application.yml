spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  #文件上传设置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
# mybaits-plus配置
mybatis-plus:
  # MyBatis Mapper所对应的XML文件位置
  mapper-locations: classpath*:/mapper/*Mapper.xml
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      # 主键类型 0:数据库ID自增 1.未定义 2.用户输入 3 id_worker 4.uuid 5.id_worker字符串表示
      id-type: AUTO
      #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
      field-strategy: NOT_NULL
      # 默认数据库表下划线命名
      table-underline: true

management:
  server:
    add-application-context-header: false
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token(不共用，避免登出时导致其他用户也登出)
  is-share: false
  # token风格(默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik)
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# Phase-1 MVP: mock WeChat + local order jobs. Override with env vars.
shop-mvp:
  mock:
    wechat-login: ${SHOP_MVP_MOCK_WECHAT_LOGIN:true}
    pay: ${SHOP_MVP_MOCK_PAY:true}
  order:
    auto-close-enabled: ${SHOP_MVP_ORDER_AUTO_CLOSE:true}
    auto-close-minutes: ${SHOP_MVP_ORDER_AUTO_CLOSE_MINUTES:30}
    auto-confirm-days: ${SHOP_MVP_ORDER_AUTO_CONFIRM_DAYS:15}
  wx:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    pay-mch-id: ${WX_PAY_MCH_ID:}
    pay-api-key: ${WX_PAY_API_KEY:}
    pay-notify-url: ${WX_PAY_NOTIFY_URL:}
    subscribe-pay-template-id: ${WX_SUBSCRIBE_PAY_TEMPLATE_ID:}
    subscribe-ship-template-id: ${WX_SUBSCRIBE_SHIP_TEMPLATE_ID:}
    subscribe-miniprogram-state: ${WX_SUBSCRIBE_MINIPROGRAM_STATE:developer}
  kuaidi100:
    customer: ${KUAIDI100_CUSTOMER:}
    key: ${KUAIDI100_KEY:}
    query-url: ${KUAIDI100_QUERY_URL:https://poll.kuaidi100.com/poll/query.do}
