# MySQL + Redis for local development of the mall4j modular monolith.
# Open-source mall4j does NOT ship RabbitMQ/Kafka. Delayed jobs use Spring
# scheduling (this fork) or optional xxl-job (upstream, client still commented out).
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
# First boot imports backend/db/yami_shop.sql then 02/03/04/05/06/07 patches.

services:
  mysql:
    image: mysql:8.0
    container_name: shop-mvp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yami_shops}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower_case_table_names=1
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./backend/db/yami_shop.sql:/docker-entrypoint-initdb.d/01-yami_shop.sql:ro
      - ./backend/db/02-patch-phase1.sql:/docker-entrypoint-initdb.d/02-patch-phase1.sql:ro
      - ./backend/db/03-patch-phase2.sql:/docker-entrypoint-initdb.d/03-patch-phase2.sql:ro
      - ./backend/db/04-patch-phase3.sql:/docker-entrypoint-initdb.d/04-patch-phase3.sql:ro
      - ./backend/db/05-patch-coupon.sql:/docker-entrypoint-initdb.d/05-patch-coupon.sql:ro
      - ./backend/db/06-patch-stock-alert.sql:/docker-entrypoint-initdb.d/06-patch-stock-alert.sql:ro
      - ./backend/db/07-patch-dashboard.sql:/docker-entrypoint-initdb.d/07-patch-dashboard.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    container_name: shop-mvp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
